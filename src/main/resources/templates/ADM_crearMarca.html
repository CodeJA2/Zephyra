<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Nueva Marca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <!-- Header -->
    <div th:replace="fragments/ADM_header"></div>

    <div class="container mt-5">
        <h1 class="text-center">Crear Marca</h1>
        <form th:action="@{/ADM/marcas}" th:object="${marca}" method="post" class="mt-3">
            <div class="form-group mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Ingrese nombre"
                    required>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/ADM/marcas" class="btn btn-secondary">Volver</a>
        </form>
    </div>
</body>
</html>
