<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center">Nuevo Producto</h1>
        <form th:action="@{/categorias}" th:object="${categoria}" method="post" class="mt-4">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ingrese nombre"
                    required>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/categorias" class="btn btn-secondary">Volver</a>
        </form>
    </div>
</body>

</html>
