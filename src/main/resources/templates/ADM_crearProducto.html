<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center">Nuevo Producto</h1>
        <form th:action="@{/productos}" th:object="${producto}" method="post" class="mt-4">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ingrese nombre" required>
            </div>
            <div class="form-group">
                <label for="precio">Precio:</label>
                <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}" placeholder="Ingrese precio" required>
            </div>
            <div class="form-group">
                <label for="descripcion" class="form-label">Descripcion:</label>
                <textarea type="text" class="form-control" id="descripcion" rows="5" th:field="*{descripcion}" placeholder="Ingrese la descripcion" required></textarea>
            </div>
            <div class="form-group">
                <label for="stock">Stock:</label>
                <input type="number" step="0" class="form-control" id="stock" th:field="*{stock}" placeholder="Ingrese precio" required>
            </div>

            <!-- Campo de selección múltiple para las categorías -->
            <div class="form-group">
                <label for="categorias">Categorías:</label>
                <select id="categorias" name="categoriaIds" multiple class="form-control" required>
                    <option th:each="categoria : ${listaCategorias}"
                            th:value="${categoria.id}"
                            th:text="${categoria.nombre}">
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/productos" class="btn btn-secondary">Volver</a>
        </form>
    </div>
</body>

</html>
