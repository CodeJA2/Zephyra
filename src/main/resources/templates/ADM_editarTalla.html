<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Editar Talla</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <!-- Header -->
    <div th:replace="fragments/ADM_header"></div>
    
    <div class="container mt-5">
        <h1 class="text-center">Editar Talla</h1>
        <form th:action="@{/ADM/tallas/actualizar/{id}(id=${talla.id})}" th:object="${talla}"
            method="post" class="mt-4">
            <div class="form-group mb-3">
                <label for="tamaño" class="form-label">Tamaño:</label>
                <input type="text" class="form-control" id="tamaño" th:field="*{tamaño}" placeholder="Ingrese tamaño"
                    required>
            </div>
            <div class="form-group mb-3">
                <label for="stock" class="form-label">Stock:</label>
                <input type="number" class="form-control" id="stock" th:field="*{stock}" placeholder="Ingrese stock"
                    required>
            </div>
            <div class="form-group mb-3">
                <label for="producto" class="form-label">ID Producto:</label>
                <input type="text" class="form-control" id="producto" th:field="*{producto.id}" 
                       th:value="${talla.producto.id}" placeholder="Ingrese ID del producto" required>
            </div>
            <button type="submit" class="btn btn-primary">Actualizar</button>
            <a href="/ADM/tallas" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>

</html>
