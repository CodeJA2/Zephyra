<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Prueba de Response Entity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <!-- Header -->
    <div th:replace="fragments/ADM_header"></div>

    <div class="container mt-5">
        <h1 class="text-center">Lista de Marcas</h1>
        <a href="/ADM/marcas/nuevo" class="btn btn-success mb-3">Agregar Marca</a>
        <button id="btnListar" type="button" class="btn btn-success mb-3">Listar Marcas</button>

        <table id="listaProductos" class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        document.getElementById('btnListar').addEventListener('click', () => {
            fetch('/getListMarcasJSON')  // Se realiza una solicitud HTTP GET a la ruta /getListMarcasJSON, que debe devolver una lista de marcas en formato JSON.
                .then(response => {     // verifica si la respuesta fue exitosa (código de estado 200). Si no lo fue, lanza un error.
                    if (!response.ok) {
                        throw new Error('Error en la red');
                    }
                    return response.json();  // Si la respuesta es exitosa, se convierte a formato JSON.
                })
                .then(data => {   //  se reciben los datos (que son un array de marcas).
                    console.log(data);
                    const tbody = document.querySelector('#listaProductos tbody');

                    tbody.innerHTML = '';  // Limpiar la tabla antes de agregar nuevas filas
                    data.forEach(marca => {   //  se itera sobre cada marca en el array data, y por cada marca se crea una nueva fila (<tr>).
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                        <td>${marca.id}</td>
                        <td>${marca.nombre}</td>
                        <td>
                            <a href="/ADM/marcas/editar/${marca.id}" class="btn btn-warning btn-sm">Editar</a>
                            <a href="/ADM/marcas/eliminar/${marca.id}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de que deseas eliminar esta marca?');">Eliminar</a>
                        </td>`;
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => {  // Si ocurre un error en cualquiera de los pasos anteriores, se captura en el bloque catch y se muestra un mensaje de error en la consola.
                    console.log('Error al consultar productos', error);
                });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
