<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Lista de Marcas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"></head>

<body>
    <!-- Header -->
    <div th:replace="fragments/ADM_header"></div>
    
    <div class="container mt-5">
        <h1 class="text-center">Lista de Marcas</h1>
        <a href="/ADM/marcas/nuevo" class="btn btn-success mb-3">Agregar Marca</a>
        <!-- <button id="btnListar">Listar</button> -->
        <table class="table table-bordered table-striped" id="listaCategorias">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="marca : ${marcas}">
                    <td th:text="${marca.id}"></td>
                    <td th:text="${marca.nombre}"></td>
                    <td>
                        <a th:href="@{/ADM/marcas/editar/{id}(id=${marca.id})}"
                            class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/ADM/marcas/eliminar/{id}(id=${marca.id})}" class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Estás seguro de que deseas eliminar esta marca?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>

</html>
